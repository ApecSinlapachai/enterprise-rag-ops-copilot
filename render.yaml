services:
  - type: web
    name: enterprise-rag-ops-copilot-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: >-
      pip install --upgrade pip &&
      pip install . &&
      python -c "from pythainlp.tokenize import word_tokenize; word_tokenize('ทดสอบระบบค้นหาเอกสารภาษาไทย', engine='newmm')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_INGEST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://enterprise-rag-ops-copilot.vercel.app,http://localhost:3000
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_COMPLEX_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBED_DIM
        value: "1536"
      - key: RATE_LIMIT_PER_MIN
        value: "15"
      - key: RATE_LIMIT_PER_DAY
        value: "60"
      - key: MIN_VEC_SIMILARITY
        value: "0.58"
      - key: MIN_FTS_RANK
        value: "0.08"
      - key: MIN_LLM_CONFIDENCE
        value: "0.55"
